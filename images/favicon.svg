<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="55%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Squircle with Glow -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#grad)" filter="url(#glow)"/>

  <!-- Specular 3D Highlight Curve -->
  <rect x="5.5" y="5.5" width="53" height="26" rx="14" fill="url(#specular)"/>
  <rect x="5" y="5" width="54" height="54" rx="15" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>

  <!-- Monogram MS with 3D Shadow -->
  <text x="32" y="39" 
        font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Plus Jakarta Sans', sans-serif" 
        font-size="24" 
        font-weight="900" 
        letter-spacing="-1px"
        text-anchor="middle" 
        fill="rgba(15,23,42,0.35)" 
        dy="2">MS</text>
  <text x="32" y="39" 
        font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Plus Jakarta Sans', sans-serif" 
        font-size="24" 
        font-weight="900" 
        letter-spacing="-1px"
        text-anchor="middle" 
        fill="#ffffff">MS</text>

  <!-- Code Sparkle Dot -->
  <circle cx="49" cy="15" r="3" fill="#38bdf8"/>
  <circle cx="49" cy="15" r="1.5" fill="#ffffff"/>
</svg>
